name: CI

# Runs on PRs into main, inside the merge queue (so each PR is re-tested against
# the latest main right before it lands), and on direct pushes to main.
on:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]

# A newer commit on the same ref cancels the older, still-running check.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ui-server:
    name: ui/server — typecheck + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Tests
        run: npm test

  eval-contracts:
    name: eval — decision-record contracts + framework anchors
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run eval harness (all committed runs + J framework-contract checks)
        run: python3 scripts/eval.py all

      - name: Check W + X + Y selftest (sector-valuation + evidence-integrity + data-sufficiency gates — fixture-free)
        run: python3 scripts/eval.py selftest

      - name: Score-breakdown unit tests (screener Phase 0.1 materiality)
        run: python3 scripts/test_screener_score_breakdown.py

      - name: Confidence scorer unit tests (deterministic two-number confidence)
        run: python3 scripts/test_confidence.py

      - name: commit-run.sh push regression test (fast-forward push from a non-main branch)
        run: python3 scripts/test_commit_run.py

      - name: Run cost/runtime attribution tool unit tests (dedup-by-requestId + list pricing)
        run: python3 scripts/test_run_cost_report.py

      - name: Screener filing-classifier selftest (routine-filing derate gate — fixture-free)
        run: python3 scripts/screener_filing_classifier.py selftest

      - name: Screener confirmation-score unit tests
        run: python3 scripts/test_screener_confirmation_score.py -v

      - name: Validate screener + commodity JSON schemas against committed fixtures
        run: python3 scripts/validate_screener_json.py --fixture

      - name: Commodity data_needs schema unit tests (optional field + tier/acquisition/slug guards)
        run: python3 scripts/test_commodity_data_needs.py

      - name: Screener feedback-tune selftest (recommend-only rank-weight nudges from the feedback ledger)
        run: python3 scripts/screener_feedback_tune.py --selftest

  tools-tests:
    name: tools — deterministic extractor + CIQ facts tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install extractor dependencies (xlrd/openpyxl/pypdf + poppler for PDF text)
        run: |
          python3 -m pip install --quiet xlrd openpyxl pypdf
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      # Closes the assessment gap "the deterministic-extractor test suite is invisible to CI" without
      # depending on the whole test-tools.sh (which also carries unrelated prompt-lint blocks). textutil
      # (.rtf) and — if poppler somehow absent — the PDF path self-SKIP on Linux; the pure-Python readers
      # assert everywhere. The gate is SELF-TERMINATING: each test is tied to the presence of the TOOL /
      # fixtures it exercises (not to its own file), so it skips cleanly before those land on main and, the
      # moment they do, HARD-RUNS — a test that has gone missing while its tool is present then FAILS the job
      # (python3 on an absent file exits nonzero) rather than skipping forever.
      - name: Deterministic extractor + CIQ facts tests (self-activates as the tools land on main)
        run: |
          rc=0
          # CIQ facts — tied to the sidecar tool. Once ciq_facts.py reaches main, its test is REQUIRED.
          if [ -f ".claude/tools/ciq_facts.py" ]; then
            echo "== test_ciq_facts.py =="
            python3 .claude/tools/test_ciq_facts.py || rc=1
          else
            echo "skip: ciq_facts.py not on this ref yet (lands with the CIQ-facts sidecar PR)"
          fi
          # Extraction bench — tied to its committed fixtures. Once testdata/extract_bench reaches main, required.
          if [ -d ".claude/tools/testdata/extract_bench" ]; then
            echo "== test_extract_pool.py =="
            python3 .claude/tools/test_extract_pool.py || rc=1
          else
            echo "skip: extract_bench fixtures not on this ref yet (lands with the extraction-bench PR)"
          fi
          # External-data router — tied to the tool. Once ingest_external.py reaches main, required.
          if [ -f ".claude/tools/ingest_external.py" ]; then
            echo "== test_ingest_external.py =="
            python3 .claude/tools/test_ingest_external.py || rc=1
          else
            echo "skip: ingest_external.py not on this ref yet (lands with the external-data-ingestion PR)"
          fi
          exit $rc

      # Connector unit tests — zero-touch (§26): every .claude/connectors/*/test_*.py runs automatically, so
      # adding a connector never touches CI. Parse/transform + manifest consistency only (no network — a live
      # endpoint is proven by `fetch.py --verify` at merge time, kept out of CI to avoid flakiness).
      - name: Connector unit tests (self-discovering — every .claude/connectors/*/test_*.py)
        run: |
          rc=0
          shopt -s nullglob
          for t in .claude/connectors/*/test_*.py; do
            echo "== $t =="
            python3 "$t" || rc=1
          done
          exit $rc

      # The doctrine twins (CLAUDE.md / AGENTS.md) must stay identical except each file's own name
      # (CLAUDE.md §28 "The twins must match") — this mechanizes what was previously discipline-only.
      - name: Doctrine twins byte-diff (CLAUDE.md == AGENTS.md modulo self-name)
        run: |
          diff <(sed 's/AGENTS\.md/DOCTRINE/g; s/CLAUDE\.md/DOCTRINE/g' CLAUDE.md) \
               <(sed 's/AGENTS\.md/DOCTRINE/g; s/CLAUDE\.md/DOCTRINE/g' AGENTS.md) \
            && echo "twins match" \
            || { echo "::error::CLAUDE.md and AGENTS.md have drifted — patch both (they are twins, §28)"; exit 1; }

  ui-web:
    name: ui/web — typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Build (vite build)
        run: npm run build
