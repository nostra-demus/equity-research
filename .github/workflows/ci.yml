name: CI

# Runs on PRs into main, inside the merge queue (so each PR is re-tested against
# the latest main right before it lands), and on direct pushes to main.
on:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]

# A newer commit on the same ref cancels the older, still-running check.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ui-server:
    name: ui/server — typecheck + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Codex prompt-input doctrine + instruction-budget gate (official CLI 0.149.0)
        run: node ../../scripts/check_codex_prompt_input.mjs --npx-version 0.149.0

  eval-contracts:
    name: eval — decision-record contracts + framework anchors
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install permanent-memory cryptography
        run: python3 -m pip install --disable-pip-version-check --require-hashes -r scripts/requirements-memory.txt

      # Keep this before eval.py all: that command intentionally writes an
      # untracked dated report, while the frozen Phase 0 corpus must be clean.
      # Phase 3–6 retrieval, shadow/MCP, controlled-write, and readiness tests are included by the
      # test_memory_*.py glob. These are local/synthetic reference gates, not production adoption.
      - name: Permanent-memory contracts, adapters, projection, baseline, and append-only guards
        run: |
          rc=0
          shopt -s nullglob
          for test in scripts/test_memory_*.py; do
            echo "== $test =="
            python3 "$test" || rc=1
          done
          python3 scripts/memory_baseline.py --check || rc=1
          python3 scripts/memory.py doctor --root . || rc=1
          python3 scripts/memory_playbook_drift.py --root . || rc=1
          python3 scripts/memory_resolver.py drill \
            --root . \
            --sample-size 16 \
            --authorize-internal-legacy || rc=1
          memory_base=""
          case "${{ github.event_name }}" in
            pull_request) memory_base="${{ github.event.pull_request.base.sha }}" ;;
            merge_group) memory_base="${{ github.event.merge_group.base_sha }}" ;;
            push) memory_base="${{ github.event.before }}" ;;
          esac
          if [ "$memory_base" = "0000000000000000000000000000000000000000" ]; then
            memory_base="$(git hash-object -t tree /dev/null)"
          fi
          if [ -z "$memory_base" ]; then
            echo "::error::could not resolve trusted permanent-memory comparison base"
            rc=1
          else
            python3 scripts/memory_immutability.py --repo . --base "$memory_base" --head HEAD || rc=1
          fi
          exit $rc

      - name: Run eval harness (all committed runs + J framework-contract checks)
        run: python3 scripts/eval.py all

      - name: Check W + X + Y selftest (sector-valuation + evidence-integrity + data-sufficiency gates — fixture-free)
        run: python3 scripts/eval.py selftest

      - name: Score-breakdown unit tests (screener Phase 0.1 materiality)
        run: python3 scripts/test_screener_score_breakdown.py

      - name: Confidence scorer unit tests (deterministic two-number confidence)
        run: python3 scripts/test_confidence.py

      - name: Ledger-records resolver tests (append-only correction layer — supersession + errata)
        run: python3 scripts/test_ledger_records.py

      - name: Benchmark feed fetcher (offline parser + file-shape tests)
        run: python3 scripts/test_fetch_market_feed.py

      - name: Provider analytical-parity gate tests (frozen runs + evidence adjudication)
        run: |
          python3 -m json.tool frameworks/provider_parity_freeze.schema.json >/dev/null
          python3 -m json.tool frameworks/provider_parity_run_binding.schema.json >/dev/null
          python3 -m json.tool frameworks/provider_parity_execution_receipt.schema.json >/dev/null
          python3 -m json.tool frameworks/provider_parity_adjudication.schema.json >/dev/null
          python3 scripts/test_compare_provider_runs.py
          python3 scripts/test_provider_parity_freeze.py

      - name: Calibration scoreboard tests (Brier, Murphy, Clopper-Pearson, e-value, effective-N, honesty)
        run: |
          python3 scripts/test_calibrate.py
          python3 scripts/test_execution_provenance.py
          python3 scripts/execution_provenance.py audit-repository --repo-root .
          python3 scripts/ops/test_calibrate_local.py

      - name: Calibration scheduler contracts (no-model wrapper + valid launchd templates)
        run: |
          bash -n scripts/ops/calibrate-local.sh scripts/ops/housekeeping.sh scripts/ops/install-services.sh
          python3 scripts/test_review_due.py
          python3 - <<'PY'
          import plistlib
          for path in (
              "scripts/ops/com.nostradamus.hk-calibrate.plist",
              "scripts/ops/com.nostradamus.hk-calibrate-daily.plist",
          ):
              with open(path, "rb") as handle:
                  plistlib.load(handle)
          PY

      - name: Calibration + market-feed selftests (deterministic engine + price-feed reader — fixture-free)
        run: |
          python3 scripts/calibrate.py --selftest
          python3 scripts/market_prices.py --selftest

      - name: Valuation math selftest (deterministic fair-value / scenario / WACC engine — fixture-free)
        run: python3 scripts/valuation_math.py --selftest

      - name: commit-run.sh push regression test (fast-forward push from a non-main branch)
        run: python3 scripts/test_commit_run.py

      - name: Repository mutation lease tests (deploy/commit/ledger transaction exclusion)
        run: |
          python3 scripts/test_repo_mutation.py
          python3 scripts/test_conviction_transactions.py

      - name: Run cost/runtime attribution tool unit tests (dedup-by-requestId + list pricing)
        run: python3 scripts/test_run_cost_report.py

      - name: Screener filing-classifier selftest (routine-filing derate gate — fixture-free)
        run: python3 scripts/screener_filing_classifier.py selftest

      - name: Screener confirmation-score unit tests
        run: python3 scripts/test_screener_confirmation_score.py -v

      - name: Validate screener + commodity JSON schemas against committed fixtures
        run: python3 scripts/validate_screener_json.py --fixture

      - name: Qualified-idea immutable admission + projection-manifest regressions
        run: python3 scripts/test_freeze_idea_admission.py

      - name: Qualified-idea Python/TypeScript canonical-digest parity
        run: python3 scripts/test_canonical_json.py

      - name: Intake execution-receipt identity, replay, and filesystem safety
        run: python3 scripts/test_intake_execution_receipt.py

      - name: Commodity calibration-gate selftest (post-gate branches the --fixture N/A runs never exercise — fixture-free)
        run: python3 scripts/validate_screener_json.py --selftest

      - name: Commodity data_needs schema unit tests (optional field + tier/acquisition/slug guards)
        run: python3 scripts/test_commodity_data_needs.py

      - name: Commodity family profile connector coverage + methodology-source exclusion
        run: |
          python3 scripts/test_gold_profile_connectors.py
          python3 scripts/test_energy_profile_connectors.py
          python3 scripts/test_industrial_metals_profile_connectors.py
          python3 scripts/test_grains_profile_connectors.py
          python3 scripts/test_softs_profile_connectors.py
          python3 scripts/test_commodity_profile_coverage.py
          python3 scripts/test_connector_http.py
          python3 .claude/connectors/cftc-cot-crude-oil/test_fetch.py
          python3 .claude/connectors/cftc-cot-natural-gas/test_fetch.py
          python3 .claude/connectors/eia-crude-oil-inventory/test_fetch.py
          python3 .claude/connectors/eia-natural-gas-storage/test_fetch.py
          python3 .claude/connectors/federal-reserve-broad-usd/test_fetch.py
          python3 .claude/connectors/cftc-cot-copper/test_fetch.py
          python3 .claude/connectors/cftc-cot-wheat-srw/test_fetch.py
          python3 .claude/connectors/cftc-cot-corn/test_fetch.py
          python3 .claude/connectors/cftc-cot-soybeans/test_fetch.py
          python3 .claude/connectors/noaa-cpc-oni/test_fetch.py
          python3 .claude/connectors/usda-wasde-grains-balance/test_fetch.py

      - name: Commodity signal evidence + statistical-validation contract tests
        run: python3 scripts/test_commodity_signal_evidence.py

      - name: Commodity analytical-orb and opacity-cap contract tests
        run: python3 scripts/test_commodity_analytical_orbs.py

      - name: Commodity dual-horizon forecast, action-matrix and immutable-archive tests
        run: |
          python3 scripts/test_commodity_forecast_contract.py
          python3 scripts/test_commodity_decision_archive.py
          python3 scripts/test_commodity_review_contract.py

      - name: Commodity calibration scoreboard selftest (Phase 4 twin — fixture-free)
        run: python3 scripts/commodity_calibrate.py --selftest

      - name: Commodity pre-mortem haircut-propagation selftest (finish-gate fix F28/F28b twin — fixture-free)
        run: python3 scripts/commodity_pre_mortem_haircut.py --selftest

      - name: Screener feedback-tune selftest (recommend-only rank-weight nudges from the feedback ledger)
        run: python3 scripts/screener_feedback_tune.py --selftest

      - name: Screener integrity-review patch selftest (frozen-record additive patch — fixture-free)
        run: python3 scripts/screener_patch_integrity_review.py --selftest

      - name: Screener calibration selftest (thesis-integrity gate distribution tally — fixture-free)
        run: python3 scripts/screener_calibrate.py --selftest

      - name: Board-index scorecard selftest (integrity-kill never scored machine_confirmed — fixture-free)
        run: python3 scripts/update_board_index.py --selftest

      - name: Data pool is symlink-safe — no tracked files under data/ (prevents the symlink-clobber "0 companies" outage)
        run: |
          tracked="$(git ls-files -- data)"
          if [ -n "$tracked" ]; then
            echo "::error::data/ is the Google-Drive symlink lane and MUST stay empty of tracked files. A tracked file lets a checkout/reset materialise data/ as a real directory, replacing the symlink with an empty folder — the cockpit then serves '0 companies' while Drive is perfectly healthy (see frameworks/MARKET_FEED.md). Move the file out of data/ (e.g. to frameworks/) and 'git rm --cached' it. Offending tracked path(s):"
            echo "$tracked"
            exit 1
          fi
          echo "OK — data/ carries no tracked files (symlink-safe)"

  tools-tests:
    name: tools — deterministic extractor + CIQ facts tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The service-load contract executes the exact OmniRoute TypeScript smoke
      # (descriptor -> HTTP adapter -> production parser), so this job needs the
      # server runtime independently of the parallel ui-server job.
      - name: Set up Node 22 for the OmniRoute scorer contract
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/server/package-lock.json

      - name: Install server runtime for the OmniRoute scorer contract
        working-directory: ui/server
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install extractor dependencies (workbooks, PDF, RTF + poppler for PDF text)
        run: |
          python3 -m pip install --quiet -r .claude/tools/requirements.txt
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      # Closes the assessment gap "the deterministic-extractor test suite is invisible to CI" without
      # depending on the whole test-tools.sh (which also carries unrelated prompt-lint blocks). textutil
      # (.rtf) and — if poppler somehow absent — the PDF path self-SKIP on Linux; the pure-Python readers
      # assert everywhere. The gate is SELF-TERMINATING: each test is tied to the presence of the TOOL /
      # fixtures it exercises (not to its own file), so it skips cleanly before those land on main and, the
      # moment they do, HARD-RUNS — a test that has gone missing while its tool is present then FAILS the job
      # (python3 on an absent file exits nonzero) rather than skipping forever.
      - name: Deterministic extractor + CIQ facts tests (self-activates as the tools land on main)
        run: |
          rc=0
          # CIQ facts — tied to the sidecar tool. Once ciq_facts.py reaches main, its test is REQUIRED.
          if [ -f ".claude/tools/ciq_facts.py" ]; then
            echo "== test_ciq_facts.py =="
            python3 .claude/tools/test_ciq_facts.py || rc=1
          else
            echo "skip: ciq_facts.py not on this ref yet (lands with the CIQ-facts sidecar PR)"
          fi
          # Supply-chain graph — tied to the parser. Its failure modes are SILENT (a wholly-owned sales
          # subsidiary surfaced as a second-order idea, a ticker invented for an unlisted counterparty, the
          # export's two-year disclosure scope dropped), so once relationship_graph.py reaches main its test
          # is REQUIRED. Synthetic sheets only — no workbook readers needed.
          if [ -f ".claude/tools/relationship_graph.py" ]; then
            echo "== test_relationship_graph.py =="
            python3 .claude/tools/test_relationship_graph.py || rc=1
          else
            echo "skip: relationship_graph.py not on this ref yet (lands with the supply-chain-ideas PR)"
          fi
          # Extraction bench — tied to its committed fixtures. Once testdata/extract_bench reaches main, required.
          if [ -d ".claude/tools/testdata/extract_bench" ]; then
            echo "== test_extract_pool.py =="
            python3 .claude/tools/test_extract_pool.py || rc=1
          else
            echo "skip: extract_bench fixtures not on this ref yet (lands with the extraction-bench PR)"
          fi
          # External-data router — tied to the tool. Once ingest_external.py reaches main, required.
          if [ -f ".claude/tools/ingest_external.py" ]; then
            echo "== test_ingest_external.py =="
            python3 .claude/tools/test_ingest_external.py || rc=1
          else
            echo "skip: ingest_external.py not on this ref yet (lands with the external-data-ingestion PR)"
          fi
          # Connector self-heal runner — tied to the tool. Once run_connectors.py reaches main, required.
          if [ -f ".claude/tools/run_connectors.py" ]; then
            echo "== test_run_connectors.py =="
            python3 .claude/tools/test_run_connectors.py || rc=1
          else
            echo "skip: run_connectors.py not on this ref yet (lands with the connector-runner PR)"
          fi
          # Connector credential migration — tied to the helper. Once present,
          # preserving historical plist-only secrets is a required release gate.
          if [ -f "scripts/ops/migrate-connector-secrets.py" ]; then
            echo "== test-migrate-connector-secrets.py =="
            python3 scripts/ops/test-migrate-connector-secrets.py || rc=1
          else
            echo "skip: connector secret migration helper not on this ref yet"
          fi
          if [ -f "scripts/ops/migrate-connector-launchagent.py" ]; then
            echo "== test-migrate-connector-launchagent.py =="
            python3 scripts/ops/test-migrate-connector-launchagent.py || rc=1
          else
            echo "skip: connector LaunchAgent migration helper not on this ref yet"
          fi
          if [ -f "scripts/ops/service-load-contract.sh" ]; then
            echo "== test-service-load-contract.sh =="
            bash scripts/ops/test-service-load-contract.sh || rc=1
          else
            echo "skip: service load result contract not on this ref yet"
          fi
          echo "== test-watchdog-cooldown.sh =="
          bash scripts/ops/test-watchdog-cooldown.sh || rc=1
          echo "== test-deploy-priority.sh =="
          bash scripts/ops/test-deploy-priority.sh || rc=1
          echo "== test-deploy-codex-import-guard.sh =="
          bash scripts/ops/test-deploy-codex-import-guard.sh || rc=1
          echo "== test-deploy-authorization.py =="
          python3 scripts/ops/test-deploy-authorization.py || rc=1
          echo "== test-connector-service-recovery.sh =="
          bash scripts/ops/test-connector-service-recovery.sh || rc=1
          echo "== test-connector-supervisor.py =="
          python3 scripts/ops/test-connector-supervisor.py || rc=1
          exit $rc

      # Connector unit tests — zero-touch (§26): every .claude/connectors/*/test_*.py runs automatically, so
      # adding a connector never touches CI. Parse/transform + manifest consistency only (no network — a live
      # endpoint is proven by `fetch.py --verify` at merge time, kept out of CI to avoid flakiness).
      - name: Connector unit tests (self-discovering — every .claude/connectors/*/test_*.py)
        run: |
          rc=0
          shopt -s nullglob
          for t in .claude/connectors/*/test_*.py; do
            echo "== $t =="
            python3 "$t" || rc=1
          done
          exit $rc

      # The doctrine twins (CLAUDE.md / AGENTS.md) must stay identical except each file's own name
      # (CLAUDE.md §28 "The twins must match") — this mechanizes what was previously discipline-only.
      - name: Doctrine twins byte-diff (CLAUDE.md == AGENTS.md modulo self-name)
        run: |
          diff <(sed 's/AGENTS\.md/DOCTRINE/g; s/CLAUDE\.md/DOCTRINE/g' CLAUDE.md) \
               <(sed 's/AGENTS\.md/DOCTRINE/g; s/CLAUDE\.md/DOCTRINE/g' AGENTS.md) \
            && echo "twins match" \
            || { echo "::error::CLAUDE.md and AGENTS.md have drifted — patch both (they are twins, §28)"; exit 1; }

  ui-web:
    name: ui/web — typecheck + tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            ui/web/package-lock.json
            ui/server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install server runtime for the provider lifecycle fixture
        working-directory: ui/server
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Tests (pure-logic units — incl. the intake "no new data" safety gate)
        run: npm test

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Provider-transparent browser lifecycle (fake Claude + Codex CLIs)
        run: npm run test:e2e

      - name: Build (vite build)
        run: npm run build

  edge:
    name: edge — offline-gate uptime-monitor unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Pure decision + alert-formatting logic for the external uptime monitor (edge/offline-gate).
      # node:test — no npm install, no network, deterministic. The Worker glue (probe/KV/status) is
      # verified with `wrangler dev` per the offline-gate README, matching the repo's edge philosophy.
      - name: Monitor + alert unit tests (node:test)
        run: node --test edge/offline-gate/test/*.test.mjs
