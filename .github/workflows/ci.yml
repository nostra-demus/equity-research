name: CI

# Runs on PRs into main, inside the merge queue (so each PR is re-tested against
# the latest main right before it lands), and on direct pushes to main.
on:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]

# A newer commit on the same ref cancels the older, still-running check.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ui-server:
    name: ui/server — typecheck + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Tests
        run: npm test

  eval-contracts:
    name: eval — decision-record contracts + framework anchors
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run eval harness (all committed runs + J framework-contract checks)
        run: python3 scripts/eval.py all

      - name: Check W + X + Y selftest (sector-valuation + evidence-integrity + data-sufficiency gates — fixture-free)
        run: python3 scripts/eval.py selftest

      - name: Score-breakdown unit tests (screener Phase 0.1 materiality)
        run: python3 scripts/test_screener_score_breakdown.py

      - name: Screener filing-classifier selftest (routine-filing derate gate — fixture-free)
        run: python3 scripts/screener_filing_classifier.py selftest

      - name: Screener confirmation-score unit tests
        run: python3 scripts/test_screener_confirmation_score.py -v

      - name: Validate screener + commodity JSON schemas against committed fixtures
        run: python3 scripts/validate_screener_json.py --fixture

      - name: Screener feedback-tune selftest (recommend-only rank-weight nudges from the feedback ledger)
        run: python3 scripts/screener_feedback_tune.py --selftest

  tools-tests:
    name: tools — deterministic extractor + CIQ facts tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install extractor dependencies (xlrd/openpyxl/pypdf + poppler for PDF text)
        run: |
          python3 -m pip install --quiet xlrd openpyxl pypdf
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      # These files land with the CIQ facts sidecar and the extraction bench PRs; this job runs them the
      # moment they reach main and, before that, records a visible skip rather than a failure. That closes
      # the assessment gap "the deterministic-extractor test suite is invisible to CI" without depending on
      # the whole test-tools.sh (which also carries unrelated prompt-lint blocks). textutil (.rtf) and — if
      # poppler somehow absent — the PDF path self-SKIP on Linux; the pure-Python readers assert everywhere.
      - name: Deterministic extractor + CIQ facts tests (skip-noted until the tools land on main)
        run: |
          rc=0
          for t in test_ciq_facts.py test_extract_pool.py; do
            if [ -f ".claude/tools/$t" ]; then
              echo "== .claude/tools/$t =="
              python3 ".claude/tools/$t" || rc=1
            else
              echo "skip: .claude/tools/$t is not on this ref yet (lands with the CIQ-facts / extraction-bench PRs)"
            fi
          done
          exit $rc

  ui-web:
    name: ui/web — typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Build (vite build)
        run: npm run build
