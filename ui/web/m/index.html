<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover exposes the safe-area insets (notch/home bar); interactive-widget makes the
         Android keyboard RESIZE the layout instead of overlaying the composer. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0e0e10" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Swarm" />
    <link rel="manifest" href="/m/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/m/icons/apple-touch-icon.png" />
    <link rel="icon" href="/m/icons/icon-192.png" />
    <title>Nostradamus Swarm · Mobile</title>
    <script>
      // Pre-paint theme guard — replicates ui/web/index.html so a light-theme user never sees a dark
      // flash — extended to keep the browser-chrome color (theme-color) in step with the app theme.
      ;(function () {
        try {
          var light = localStorage.getItem('nsw.theme') === 'light'
          if (light) document.documentElement.setAttribute('data-theme', 'light')
          var m = document.querySelector('meta[name="theme-color"]')
          if (m) m.setAttribute('content', light ? '#f4f3ef' : '#0e0e10')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/mobile/main.tsx"></script>
  </body>
</html>
